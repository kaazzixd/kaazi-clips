# ==============================================================
#   QUICK SETUP — edit these lines, ignore everything below
# ==============================================================

model: gemma:7b        # your AI model (see: python main.py models)
channel: ""            # your channel, e.g. "@YourHandle"

content_language: auto # language of the streams you clip: auto = detect per
                       # video (fine for most). Force a code (es / pt / hi /
                       # id / en ...) if bilingual streams get transcribed in
                       # the wrong language — captions burn in this language.

auto_upload: false     # true = post Shorts to YouTube automatically
                       # (needs one-time setup: README "Enable uploads")
                       # NOTE: this is the command-line daemon only. To publish
                       # from the editor instead, turn on Settings -> Publish
                       # to YouTube; it ignores both of these keys.

privacy: public        # public / unlisted / private for posted Shorts.
                       # NOTE: until your API project passes YouTube's free
                       # audit, YouTube locks API uploads to private whatever
                       # this says — permanently, and it cannot be undone in
                       # Studio. See README "Posting publicly".

# ==============================================================
#   Advanced settings — defaults are fine for most people
# ==============================================================

channels: []

poll_interval_minutes: 15

llm:
  translation_model: ""
  temperature: 0.4
  num_ctx: 8192
  ollama_host: http://localhost:11434

whisper:
  model: auto
  device: auto

transcription:
  backend: local
  model: ""

clips:
  min_score: 55
  max_clips_per_video: 0
  min_duration: 10
  max_duration: 60
  vertical: true
  captions: true
  outro: false          # end card disabled

scoring:
  weights:
    text: 0.30
    visual: 0.20
    reaction: 0.20
    audio: 0.20
    engagement: 0.10
  signal_peak_percentile: 85
  creator_context_max: 6
  action_bonus: 10
  audience_bonus: 8
  rerank_pool: 8
  reaction_top_k: 8

analysis:
  max_overlap: 0.4
  max_text_similarity: 0.7
  max_segment_reuse: 0.4
  chunk_seconds: 300
  chunk_overlap_seconds: 45
  long_video_threshold_seconds: 420

video:
  encoder: auto
  parallel_renders: 3

tracking:
  detector: yolov8n-pose.pt
  sample_fps: 8

upload:
  daily_limit: 6
  client_secret: config/client_secret.json

feedback:
  # Empty = reports save to a local file. Set your own relay if you deploy one.
  relay_url: ""

paths:
  data_dir: data
