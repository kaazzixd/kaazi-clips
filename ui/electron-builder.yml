# Windows installer for Kaazi Clips.
#
# Produces an NSIS installer that carries everything the app needs: the
# Electron front end, the frozen Python engine, FFmpeg, and the YOLO
# weights. A creator installs it and pastes a link — no Python, no PATH,
# no terminal.
#
# Built by scripts/build_installer.py, which freezes the backend first and
# leaves it in build/dist/backend/ for the extraResources rule below.

appId: com.kaaziclips.app
productName: Kaazi Clips
copyright: Copyright © 2026 kaazixd

directories:
  output: ../release
  buildResources: build

# Embeds build/icon.ico into the packaged .exe.
afterPack: build/afterPack.cjs

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../build/dist/backend
    to: backend
    filter:
      - "**/*"

win:
  target:
    - target: nsis-web
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: KaaziClips-${version}-${arch}.${ext}
  signAndEditExecutable: false

# Microsoft Store packaging (optional, not part of default build).
# Update identity values if you publish to the Store under your own account.
appx:
  identityName: KaaziClips.KaaziClips
  publisher: CN=kaazixd
  publisherDisplayName: kaazixd
  applicationId: KaaziClips
  displayName: Kaazi Clips
  backgroundColor: '#0A1628'
  languages:
    - en-US
  setBuildNumber: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kaazi Clips
  deleteAppDataOnUninstall: false

nsisWeb:
  artifactName: KaaziClips-Web-Setup-${version}.${ext}

compression: maximum

# Update feed. Point this at your own release host when you ship builds.
publish:
  - provider: generic
    url: https://huggingface.co/kaazzixd/kaazi-clips-releases/resolve/main
    channel: latest
